<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img">
  <rect width="920" height="280" rx="18" fill="#F4F6F8"/>
  
  <text x="28" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B3139">Potential use cases</text>
  <text x="28" y="56" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5C6B75">Same MCP tools. Different plant problems.</text>

  <g>
    <rect x="28" y="78" width="280" height="170" rx="16" fill="#FFFFFF" stroke="#D5DDE3" stroke-width="1.5"/>
    <circle cx="60" cy="110" r="16" fill="#0D9488"/>
    <g transform="translate(60,110) scale(0.85)"><path d="M-6 -10 H2 L8 -4 V10 H-6 Z" fill="none" stroke="white" stroke-width="2"/><path d="M2 -10 V-4 H8" fill="none" stroke="white" stroke-width="2"/></g>
    <text x="86" y="116" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B3139">AP invoice intake</text>
    <text x="48" y="146" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5C6B75">Vendor invoices to fields +</text>
<text x="48" y="162" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5C6B75">needs_review. Nothing posts to ERP</text>
<text x="48" y="178" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5C6B75">until weak totals are patched.</text>
  </g>

  <g>
    <rect x="326" y="78" width="280" height="170" rx="16" fill="#FFFFFF" stroke="#D5DDE3" stroke-width="1.5"/>
    <circle cx="358" cy="110" r="16" fill="#1B3139"/>
    <g transform="translate(358,110) scale(0.85)"><rect x="-8" y="-8" width="16" height="16" rx="2" fill="none" stroke="white" stroke-width="2"/><path d="M-4 -2 H4 M-4 2 H2 M-4 6 H4" stroke="white" stroke-width="2"/></g>
    <text x="384" y="116" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B3139">PO confirmation</text>
    <text x="346" y="146" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5C6B75">Buyer PO vs vendor ack. Mismatched PO</text>
<text x="346" y="162" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5C6B75">numbers land in the review queue, not</text>
<text x="346" y="178" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5C6B75">in Epicor.</text>
  </g>

  <g>
    <rect x="624" y="78" width="280" height="170" rx="16" fill="#FFFFFF" stroke="#D5DDE3" stroke-width="1.5"/>
    <circle cx="656" cy="110" r="16" fill="#FF3621"/>
    <g transform="translate(656,110) scale(0.85)"><rect x="-9" y="-6" width="18" height="12" rx="2" fill="none" stroke="white" stroke-width="2"/><path d="M-9 -6 L0 2 L9 -6" fill="none" stroke="white" stroke-width="2"/></g>
    <text x="682" y="116" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B3139">RFQ triage</text>
    <text x="644" y="146" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5C6B75">Inbound RFQs become requestor +</text>
<text x="644" y="162" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5C6B75">rfq_number JSON for a quoting agent.</text>
  </g>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "namakan-docintel"
version = "0.3.0"
description = "Document intelligence: schema validation, confidence scoring, review queue."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Namakan AI Engineering" }]
dependencies = []

[project.scripts]
namakan-docintel = "namakan_docintel.server:main"

[project.optional-dependencies]
guardrails = ["namakan-guardrails @ git+https://github.com/cfollette18/namakan-guardrails.git"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/cfollette18/namakan-docintel"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
